name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ci360-test-secret-change-for-real-environments-1234567890
      DATABASE_PATH: ./data/test-ci360.db
      UPLOAD_DIR: ./data/test-private-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=high
